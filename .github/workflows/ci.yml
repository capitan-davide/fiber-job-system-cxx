name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest

    strategy:
      fail-fast: false
      matrix:
        sanitize: [none, thread]

    name: build-and-test (sanitize=${{ matrix.sanitize }})

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel cmake git catch2

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFJS_ENABLE_SANITIZERS=${{ matrix.sanitize }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --build-dir build --output-on-failure
